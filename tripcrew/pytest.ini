[pytest]
# `eval` marks tests that call a real judge LLM over the network (deepeval,
# see tests/evals/). Excluded from a plain `pytest` run by addopts below --
# every other test in this project mocks its network calls (requests.get in
# tests/test_attractions.py and friends), these are the one deliberate
# exception, and they shouldn't run just because someone ran `pytest`
# without reading tests/evals/test_writeup_groundedness.py's own docstring
# first. Run them explicitly with `pytest -m eval`; needs the same .env
# this project already asks for (OPENAI_API_KEY/OPENAI_API_BASE), see
# judge_llm.py's own docstring for why no second API key is needed.
markers =
    eval: calls a real judge LLM over the network, excluded by default
addopts = -m "not eval"
